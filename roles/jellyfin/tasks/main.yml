---
# Rôle : jellyfin — serveur média Jellyfin
# Story 9.4.1 AC3 — pattern adguard (docker run + template route Traefik).
# Findings runtime 9.3 intégrés d'origine :
#   - readiness via docker inspect (jamais de wait_for 127.0.0.1 dans le worker)
#   - route écrite dans {{ traefik_dynamic_dir }} (mount worker /etc/traefik/dynamic)
#   - idempotence ARCH-R5 : rm -f avant run → re-run sans « name already in use »
# Extravars requis : capsule_id, racine_slug, jellyfin_port (allocateur AC4).

- name: Créer le répertoire de données Jellyfin pour la capsule
  ansible.builtin.file:
    path: "/opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - config
    - cache
    - media

- name: "Créer le réseau Docker de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: docker network create capsule_{{ capsule_id }}
  register: capsule_network_create
  failed_when:
    - capsule_network_create.rc != 0
    - "'already exists' not in capsule_network_create.stderr"
  changed_when: capsule_network_create.rc == 0

- name: Pull image Jellyfin (arm64 validée spike 2026-07-20)
  ansible.builtin.command:
    cmd: docker pull jellyfin/jellyfin:latest
  changed_when: true

- name: Supprimer container Jellyfin existant si présent (idempotence ARCH-R5)
  ansible.builtin.command:
    cmd: docker rm -f jellyfin-{{ capsule_id }}
  failed_when: false
  changed_when: true

- name: Démarrer container Jellyfin
  ansible.builtin.command:
    cmd: >
      docker run -d
      --name jellyfin-{{ capsule_id }}
      --restart unless-stopped
      --network capsule_{{ capsule_id }}
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/config:/config
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/cache:/cache
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/media:/media
      jellyfin/jellyfin:latest
  changed_when: true

# Readiness (review 9.4.1) : State.Status distingue « démarre » de « crashé » —
# exited/dead termine la boucle immédiatement (fast-fail).
- name: Attendre que Jellyfin soit prêt (readiness docker inspect)
  ansible.builtin.command:
    cmd: >-
      docker inspect -f {% raw %}{{.State.Status}}{% endraw %} jellyfin-{{ capsule_id }}
  register: jellyfin_state
  until: (jellyfin_state.stdout | trim) in ["running", "exited", "dead"]
  retries: 12
  delay: 5
  changed_when: false

- name: Vérifier que Jellyfin est running (fast-fail si crash)
  ansible.builtin.fail:
    msg: "Container jellyfin-{{ capsule_id }} en état '{{ jellyfin_state.stdout | trim }}' (attendu : running)"
  when: (jellyfin_state.stdout | trim) != "running"

- name: "Attacher Traefik au réseau de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: >-
      docker network connect capsule_{{ capsule_id }}
      {{ traefik_container_name | default('homebox-traefik') }}
  register: traefik_network_attach
  failed_when:
    - traefik_network_attach.rc != 0
    - "'already exists' not in traefik_network_attach.stderr"
  changed_when: traefik_network_attach.rc == 0

- name: Écrire la route Traefik pour jellyfin.{{ racine_slug }}.homegalaxy.io
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ traefik_dynamic_dir | default('/etc/traefik/dynamic') }}/capsule-{{ capsule_id }}-jellyfin.yml"
    mode: "0644"
