---
# Rôle : jellyfin — serveur média Jellyfin
# Story 9.4.1 AC3 — pattern adguard (docker run + template route Traefik).
# Image ÉPINGLÉE tag + digest d'index (quick-fix party 2026-09-27, patron memos) :
# jamais `:latest` — un `docker pull` flottant fait monter l'app de version
# majeure sans prévenir. Story 9.4.5b-8a : épingle déplacée 10.11.11 → 12.1
# EN CONNAISSANCE DE CAUSE (porte compagnon `ApiKey`, exemptions ARCH-R8
# re-mesurées). ⚠️ Jellyfin 12 migre sa base SANS retour arrière : une instance
# existante se monte par le bouton « Mettre à jour » (writer
# `upgrade_app_instance` : snapshot de capsule + sauvegarde à froid AVANT ce
# rôle), jamais par une réinstallation. Scan complet de bibliothèque requis
# après montée (notes de version 12.0).
# Findings runtime 9.3 intégrés d'origine :
#   - readiness via docker inspect (jamais de wait_for 127.0.0.1 dans le worker)
#   - route écrite dans {{ traefik_dynamic_dir }} (mount worker /etc/traefik/dynamic)
#   - idempotence ARCH-R5 : rm -f avant run → re-run sans « name already in use »
#
# Post-9.4.5c (L8) : AUCUN port hôte publié. Jellyfin écoute sur son port
# INTERNE 8096 ; le container rejoint `capsule_{{ capsule_id }}` et Traefik,
# attaché au même réseau, l'adresse par NOM de container
# (`jellyfin-{{ capsule_id }}:8096`). La route porte la chaîne complète
# secure-headers → authelia → hg-authz, donc l'app n'est atteignable que par
# Traefik, jamais en direct.
# Extravars requis : capsule_id, racine_slug. `jellyfin_port` n'est plus consommé
# (plus rien à publier) — l'allocateur peut continuer à l'attribuer, sans effet.

- name: Créer le répertoire de données Jellyfin pour la capsule
  ansible.builtin.file:
    path: "/opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - config
    - cache
    - media

# Idempotence (Story 9.4.5c AC4, durcie review L6) : on teste la PRÉSENCE du
# réseau au lieu de chercher « already exists » dans la stderr Docker — ce
# wording anglais n'est pas un contrat, et le filtrer masquait tous les autres
# échecs (dockerd injoignable, quota d'adresses, …) derrière un rc != 0 muet.
- name: "Vérifier si le réseau Docker de la capsule existe déjà"
  ansible.builtin.command:
    cmd: >-
      docker network ls --filter name=^capsule_{{ capsule_id }}$
      --format {% raw %}{{.Name}}{% endraw %}
  register: capsule_network_ls
  changed_when: false

- name: "Créer le réseau Docker de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: docker network create capsule_{{ capsule_id }}
  when: (capsule_network_ls.stdout | trim) == ""
  changed_when: true

- name: Pull image Jellyfin épinglée (12.1, index multi-arch amd64+arm64 — digest mesuré 2026-09-27, story 9.4.5b-8a AC0.1)
  ansible.builtin.command:
    cmd: docker pull jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
  changed_when: true

- name: Supprimer container Jellyfin existant si présent (idempotence ARCH-R5)
  ansible.builtin.command:
    cmd: docker rm -f jellyfin-{{ capsule_id }}
  failed_when: false
  changed_when: true

- name: Démarrer container Jellyfin
  ansible.builtin.command:
    cmd: >
      docker run -d
      --name jellyfin-{{ capsule_id }}
      --restart unless-stopped
      --network capsule_{{ capsule_id }}
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/config:/config
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/cache:/cache
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/jellyfin/media:/media
      jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
  changed_when: true

# Readiness (review 9.4.1) : State.Status distingue « démarre » de « crashé » —
# exited/dead termine la boucle immédiatement (fast-fail).
- name: Attendre que Jellyfin soit prêt (readiness docker inspect)
  ansible.builtin.command:
    cmd: >-
      docker inspect -f {% raw %}{{.State.Status}}{% endraw %} jellyfin-{{ capsule_id }}
  register: jellyfin_state
  until: (jellyfin_state.stdout | trim) in ["running", "exited", "dead"]
  retries: 12
  delay: 5
  changed_when: false

- name: Vérifier que Jellyfin est running (fast-fail si crash)
  ansible.builtin.fail:
    msg: "Container jellyfin-{{ capsule_id }} en état '{{ jellyfin_state.stdout | trim }}' (attendu : running)"
  when: (jellyfin_state.stdout | trim) != "running"

# Review L6 — mode de panne non couvert jusqu'ici : sans Traefik sur CE dockerd,
# l'app n'a plus AUCUN chemin réseau (les ports hôtes ont disparu en 9.4.5c).
# On nomme la cause ici plutôt que d'échouer sur un « No such container » brut
# au dernier tiers du rôle, une fois le container déjà démarré.
- name: "Vérifier que le container Traefik existe sur ce dockerd"
  ansible.builtin.command:
    cmd: >-
      docker container inspect -f {% raw %}{{.Id}}{% endraw %}
      {{ traefik_container_name | default('homebox-traefik') }}
  register: traefik_container_check
  failed_when: false
  changed_when: false

- name: "Échouer avec un message actionnable si Traefik est introuvable"
  ansible.builtin.fail:
    msg: >-
      Container Traefik « {{ traefik_container_name | default('homebox-traefik') }} »
      introuvable sur le dockerd de ce worker. Depuis la Story 9.4.5c les apps ne
      publient plus de port hôte : Traefik DOIT tourner sur le même dockerd et
      rejoindre « capsule_{{ capsule_id }} », sinon l'app installée reste
      injoignable. Corriger l'extravar `traefik_container_name` ou démarrer
      Traefik, puis relancer l'installation.
  when: traefik_container_check.rc != 0

# `docker ps -a --filter network=…` plutôt que `docker network inspect -f` :
# `ansible.builtin.command` ne passe PAS par un shell, il découpe la commande
# avec shlex — un go-template `{{range .Containers}}…` contient un espace et
# serait éclaté en plusieurs arguments. `-a` inclut les containers arrêtés :
# un Traefik stoppé est TOUJOURS attaché au réseau, le re-connecter échouerait.
- name: "Vérifier si Traefik est déjà attaché au réseau de la capsule"
  ansible.builtin.command:
    cmd: >-
      docker ps -a --filter network=capsule_{{ capsule_id }}
      --format {% raw %}{{.Names}}{% endraw %}
  register: capsule_network_members
  changed_when: false

- name: "Attacher Traefik au réseau de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: >-
      docker network connect capsule_{{ capsule_id }}
      {{ traefik_container_name | default('homebox-traefik') }}
  when: >-
    (traefik_container_name | default('homebox-traefik'))
    not in capsule_network_members.stdout_lines
  changed_when: true

- name: Écrire la route Traefik pour jellyfin.{{ racine_slug }}.homegalaxy.io
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ traefik_dynamic_dir | default('/etc/traefik/dynamic') }}/capsule-{{ capsule_id }}-jellyfin.yml"
    mode: "0644"
