---
# Rôle : ollama-stack — Ollama LLM + Open WebUI
# Story 9-1 (AC#7, AC#8) · fixes runtime Story 9.4.1 AC3 :
#   - wait_for 127.0.0.1 supprimé → readiness docker inspect
#   - route écrite dans {{ traefik_dynamic_dir }} (mount worker /etc/traefik/dynamic)
#   - idempotence ARCH-R5 : rm -f avant run → re-run sans « name already in use »
#   - modèle paramétrable : ollama_model (défaut tinyllama — dev/Pi-friendly),
#     validé côté backend contre models[] du manifest (AC5)
#   - ollama_skip_pull (défaut false) : saute le pull du modèle — usage tests
#     runtime rapides uniquement, jamais en prod (le modèle manquerait)
#
# Post-9.4.5c (L8) : AUCUN port hôte publié, pour aucun des deux containers.
# Ollama écoute sur son port INTERNE 11434 et n'est joignable QUE depuis le
# réseau `capsule_{{ capsule_id }}` — c'est-à-dire par Open WebUI
# (`OLLAMA_BASE_URL=http://ollama-{{ capsule_id }}:11434`), jamais depuis
# l'extérieur : l'API Ollama n'a aucune authentification propre, la lui exposer
# reviendrait à publier un LLM ouvert. Open WebUI écoute sur son port INTERNE
# 8080 ; Traefik, attaché au réseau de capsule, l'adresse par NOM de container
# et sa route porte la chaîne complète secure-headers → authelia → hg-authz.
# Extravars requis : capsule_id, racine_slug. `ollama_port` / `openwebui_port`
# ne sont plus consommés (plus rien à publier) — l'allocateur peut continuer à
# les attribuer, sans effet.

- name: Créer le répertoire de données Ollama
  ansible.builtin.file:
    path: "/opt/homegalaxy/capsules/{{ capsule_id }}/ollama"
    state: directory
    mode: "0755"

- name: Créer le répertoire de données Open WebUI
  ansible.builtin.file:
    path: "/opt/homegalaxy/capsules/{{ capsule_id }}/openwebui"
    state: directory
    mode: "0755"

# Idempotence (Story 9.4.5c AC4, durcie review L6) : on teste la PRÉSENCE du
# réseau au lieu de chercher « already exists » dans la stderr Docker — ce
# wording anglais n'est pas un contrat, et le filtrer masquait tous les autres
# échecs (dockerd injoignable, quota d'adresses, …) derrière un rc != 0 muet.
- name: "Vérifier si le réseau Docker de la capsule existe déjà"
  ansible.builtin.command:
    cmd: >-
      docker network ls --filter name=^capsule_{{ capsule_id }}$
      --format {% raw %}{{.Name}}{% endraw %}
  register: capsule_network_ls
  changed_when: false

- name: "Créer le réseau Docker de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: docker network create capsule_{{ capsule_id }}
  when: (capsule_network_ls.stdout | trim) == ""
  changed_when: true

- name: Pull image Ollama
  ansible.builtin.command:
    cmd: docker pull ollama/ollama:latest
  changed_when: true

- name: Supprimer container Ollama existant si présent (idempotence ARCH-R5)
  ansible.builtin.command:
    cmd: docker rm -f ollama-{{ capsule_id }}
  failed_when: false
  changed_when: true

- name: Démarrer container Ollama (inférence CPU)
  ansible.builtin.command:
    cmd: >
      docker run -d
      --name ollama-{{ capsule_id }}
      --restart unless-stopped
      --network capsule_{{ capsule_id }}
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/ollama:/root/.ollama
      ollama/ollama:latest
  changed_when: true

# Readiness (review 9.4.1) : on inspecte State.Status pour distinguer
# « démarre encore » d'« a crashé » — exited/dead termine la boucle
# immédiatement au lieu de consommer tout le budget de retries.
- name: Attendre qu'Ollama soit prêt (readiness docker inspect)
  ansible.builtin.command:
    cmd: >-
      docker inspect -f {% raw %}{{.State.Status}}{% endraw %} ollama-{{ capsule_id }}
  register: ollama_state
  until: (ollama_state.stdout | trim) in ["running", "exited", "dead"]
  retries: 12
  delay: 5
  changed_when: false

- name: Vérifier qu'Ollama est running (fast-fail si crash)
  ansible.builtin.fail:
    msg: "Container ollama-{{ capsule_id }} en état '{{ ollama_state.stdout | trim }}' (attendu : running)"
  when: (ollama_state.stdout | trim) != "running"

- name: Télécharger le modèle {{ ollama_model | default('tinyllama') }}
  ansible.builtin.command:
    cmd: docker exec ollama-{{ capsule_id }} ollama pull {{ ollama_model | default('tinyllama') }}
  changed_when: true
  when: not (ollama_skip_pull | default(false) | bool)

- name: Pull image Open WebUI
  ansible.builtin.command:
    cmd: docker pull ghcr.io/open-webui/open-webui:main
  changed_when: true

- name: Supprimer container Open WebUI existant si présent (idempotence ARCH-R5)
  ansible.builtin.command:
    cmd: docker rm -f openwebui-{{ capsule_id }}
  failed_when: false
  changed_when: true

# Volume /app/backend/data (review 9.4.1 C2) : Open WebUI stocke comptes,
# conversations et RAG dans une SQLite interne — sans volume, le rm -f de
# l'idempotence ARCH-R5 détruisait toutes les données à chaque re-run.
- name: Démarrer container Open WebUI
  ansible.builtin.command:
    cmd: >
      docker run -d
      --name openwebui-{{ capsule_id }}
      --restart unless-stopped
      --network capsule_{{ capsule_id }}
      -e OLLAMA_BASE_URL=http://ollama-{{ capsule_id }}:11434
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/openwebui:/app/backend/data
      ghcr.io/open-webui/open-webui:main
  changed_when: true

- name: Attendre qu'Open WebUI soit prêt (readiness docker inspect)
  ansible.builtin.command:
    cmd: >-
      docker inspect -f {% raw %}{{.State.Status}}{% endraw %} openwebui-{{ capsule_id }}
  register: openwebui_state
  until: (openwebui_state.stdout | trim) in ["running", "exited", "dead"]
  retries: 24
  delay: 5
  changed_when: false

- name: Vérifier qu'Open WebUI est running (fast-fail si crash)
  ansible.builtin.fail:
    msg: "Container openwebui-{{ capsule_id }} en état '{{ openwebui_state.stdout | trim }}' (attendu : running)"
  when: (openwebui_state.stdout | trim) != "running"

# Review L6 — mode de panne non couvert jusqu'ici : sans Traefik sur CE dockerd,
# l'app n'a plus AUCUN chemin réseau (les ports hôtes ont disparu en 9.4.5c).
# On nomme la cause ici plutôt que d'échouer sur un « No such container » brut
# au dernier tiers du rôle, une fois le container déjà démarré.
- name: "Vérifier que le container Traefik existe sur ce dockerd"
  ansible.builtin.command:
    cmd: >-
      docker container inspect -f {% raw %}{{.Id}}{% endraw %}
      {{ traefik_container_name | default('homebox-traefik') }}
  register: traefik_container_check
  failed_when: false
  changed_when: false

- name: "Échouer avec un message actionnable si Traefik est introuvable"
  ansible.builtin.fail:
    msg: >-
      Container Traefik « {{ traefik_container_name | default('homebox-traefik') }} »
      introuvable sur le dockerd de ce worker. Depuis la Story 9.4.5c les apps ne
      publient plus de port hôte : Traefik DOIT tourner sur le même dockerd et
      rejoindre « capsule_{{ capsule_id }} », sinon l'app installée reste
      injoignable. Corriger l'extravar `traefik_container_name` ou démarrer
      Traefik, puis relancer l'installation.
  when: traefik_container_check.rc != 0

# `docker ps -a --filter network=…` plutôt que `docker network inspect -f` :
# `ansible.builtin.command` ne passe PAS par un shell, il découpe la commande
# avec shlex — un go-template `{{range .Containers}}…` contient un espace et
# serait éclaté en plusieurs arguments. `-a` inclut les containers arrêtés :
# un Traefik stoppé est TOUJOURS attaché au réseau, le re-connecter échouerait.
- name: "Vérifier si Traefik est déjà attaché au réseau de la capsule"
  ansible.builtin.command:
    cmd: >-
      docker ps -a --filter network=capsule_{{ capsule_id }}
      --format {% raw %}{{.Names}}{% endraw %}
  register: capsule_network_members
  changed_when: false

- name: "Attacher Traefik au réseau de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: >-
      docker network connect capsule_{{ capsule_id }}
      {{ traefik_container_name | default('homebox-traefik') }}
  when: >-
    (traefik_container_name | default('homebox-traefik'))
    not in capsule_network_members.stdout_lines
  changed_when: true

- name: Écrire la route Traefik pour openwebui.{{ racine_slug }}.homegalaxy.io
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ traefik_dynamic_dir | default('/etc/traefik/dynamic') }}/capsule-{{ capsule_id }}-openwebui.yml"
    mode: "0644"
