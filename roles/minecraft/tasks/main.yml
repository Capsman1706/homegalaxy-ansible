---
# Rôle : minecraft — Serveur Minecraft Java + Dynmap
# AC#6, AC#8 — Story 9-1
# Déploie itzg/minecraft-server avec Dynmap plugin
# Expose port TCP 25565 (client Java) via Traefik + port HTTP Dynmap

- name: Créer le répertoire de données Minecraft
  ansible.builtin.file:
    path: "/opt/homegalaxy/capsules/{{ capsule_id }}/minecraft"
    state: directory
    mode: "0755"

- name: "Créer le réseau Docker de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: docker network create capsule_{{ capsule_id }}
  register: capsule_network_create
  failed_when:
    - capsule_network_create.rc != 0
    - "'already exists' not in capsule_network_create.stderr"
  changed_when: capsule_network_create.rc == 0

- name: Pull image Minecraft Server
  ansible.builtin.command:
    cmd: docker pull itzg/minecraft-server:latest
  changed_when: true

- name: Supprimer container Minecraft existant si présent
  ansible.builtin.command:
    cmd: docker rm -f minecraft-{{ capsule_id }}
  ignore_errors: true
  changed_when: true

- name: Démarrer container Minecraft Server avec Dynmap
  ansible.builtin.command:
    cmd: >
      docker run -d
      --name minecraft-{{ capsule_id }}
      --restart unless-stopped
      --network capsule_{{ capsule_id }}
      -e EULA=TRUE
      -e TYPE=PAPER
      -e VERSION=LATEST
      -e MEMORY=2G
      -e MODRINTH_PROJECTS=dynmap
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/minecraft:/data
      itzg/minecraft-server:latest
  changed_when: true

# Story 9.4.5c AC4 : le port hôte n'existe plus — readiness par docker
# inspect (pattern jellyfin). Le boot Minecraft est long : 36×5 s.
- name: Attendre que le serveur Minecraft soit prêt (readiness docker inspect)
  ansible.builtin.command:
    cmd: >-
      docker inspect -f {% raw %}{{.State.Status}}{% endraw %} minecraft-{{ capsule_id }}
  register: minecraft_state
  until: (minecraft_state.stdout | trim) in ["running", "exited", "dead"]
  retries: 36
  delay: 5
  changed_when: false

- name: Vérifier que Minecraft est running (fast-fail si crash)
  ansible.builtin.fail:
    msg: "Container minecraft-{{ capsule_id }} en état '{{ minecraft_state.stdout | trim }}' (attendu : running)"
  when: (minecraft_state.stdout | trim) != "running"

- name: "Attacher Traefik au réseau de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: >-
      docker network connect capsule_{{ capsule_id }}
      {{ traefik_container_name | default('homebox-traefik') }}
  register: traefik_network_attach
  failed_when:
    - traefik_network_attach.rc != 0
    - "'already exists' not in traefik_network_attach.stderr"
  changed_when: traefik_network_attach.rc == 0

- name: Écrire la route Traefik HTTP pour dynmap.{{ racine_slug }}.homegalaxy.io
  ansible.builtin.template:
    src: traefik-route-http.yml.j2
    dest: "/opt/homegalaxy/data/traefik/dynamic/capsules/dynmap-{{ capsule_id }}.yml"
    mode: "0644"

- name: Écrire la route Traefik TCP pour port 25565
  ansible.builtin.template:
    src: traefik-route-tcp.yml.j2
    dest: "/opt/homegalaxy/data/traefik/dynamic/capsules/minecraft-tcp-{{ capsule_id }}.yml"
    mode: "0644"
