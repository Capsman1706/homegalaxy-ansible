---
# Rôle : adguard — AdGuard Home DNS + filtrage pub
# Image ÉPINGLÉE tag + digest d'index (quick-fix party 2026-09-27, patron memos) :
# 9.4.5b-8 lit l'empreinte bcrypt de `AdGuardHome.yaml` — un lecteur épinglé
# sur une app en `:latest` changerait de format sans prévenir. Story 9.4.5b-8a :
# épingle déplacée v0.107.78 → v0.107.79 (correctifs sécurité ; mesuré : aucun
# changement sur `/control/login`, `/control/status`, Basic ; `schema_version`
# 34 inchangé au démarrage sur une conf …78).
# Story 9-1 (AC#4, AC#8) · fixes runtime Story 9.4.1 AC3 :
#   - wait_for 127.0.0.1 supprimé → readiness docker inspect (le worker n'est
#     pas le host : les ports publiés n'y sont pas joignables)
#   - route écrite dans {{ traefik_dynamic_dir }} (mount worker /etc/traefik/dynamic —
#     l'ancien layout /opt/homegalaxy/data/... n'existe pas)
#   - idempotence ARCH-R5 : rm -f avant run → re-run sans « name already in use »
#
# Post-9.4.5c (L8) : AUCUN port hôte publié — ni le 53 DNS (décision honnêteté
# vitrine AC2), ni l'UI. AdGuard écoute sur son port INTERNE 3000 ; le container
# rejoint `capsule_{{ capsule_id }}` et Traefik, attaché au même réseau,
# l'adresse par NOM de container (`adguard-{{ capsule_id }}:3000`). La route
# porte la chaîne complète secure-headers → authelia → hg-authz, donc l'UI n'est
# atteignable que par Traefik, jamais en direct.
# Extravars requis : capsule_id, racine_slug. `adguard_port` n'est plus consommé
# (plus rien à publier) — l'allocateur peut continuer à l'attribuer, sans effet.

# Review 9.4.1 : /work et /conf sur deux répertoires SÉPARÉS (convention
# AdGuard Home officielle) — un même host-dir monté deux fois mélangeait
# données de travail et configuration.
- name: Créer les répertoires de données AdGuard pour la capsule
  ansible.builtin.file:
    path: "/opt/homegalaxy/capsules/{{ capsule_id }}/adguard/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - work
    - conf

# Idempotence (Story 9.4.5c AC4, durcie review L6) : on teste la PRÉSENCE du
# réseau au lieu de chercher « already exists » dans la stderr Docker — ce
# wording anglais n'est pas un contrat, et le filtrer masquait tous les autres
# échecs (dockerd injoignable, quota d'adresses, …) derrière un rc != 0 muet.
- name: "Vérifier si le réseau Docker de la capsule existe déjà"
  ansible.builtin.command:
    cmd: >-
      docker network ls --filter name=^capsule_{{ capsule_id }}$
      --format {% raw %}{{.Name}}{% endraw %}
  register: capsule_network_ls
  changed_when: false

- name: "Créer le réseau Docker de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: docker network create capsule_{{ capsule_id }}
  when: (capsule_network_ls.stdout | trim) == ""
  changed_when: true

- name: Pull image AdGuard Home épinglée (v0.107.79, index multi-arch — digest mesuré 2026-09-27, story 9.4.5b-8a AC0.1)
  ansible.builtin.command:
    cmd: docker pull adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
  changed_when: true

- name: Supprimer container AdGuard existant si présent (idempotence ARCH-R5)
  ansible.builtin.command:
    cmd: docker rm -f adguard-{{ capsule_id }}
  failed_when: false
  changed_when: true

- name: Démarrer container AdGuard Home
  ansible.builtin.command:
    cmd: >
      docker run -d
      --name adguard-{{ capsule_id }}
      --restart unless-stopped
      --network capsule_{{ capsule_id }}
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/adguard/work:/opt/adguardhome/work
      -v /opt/homegalaxy/capsules/{{ capsule_id }}/adguard/conf:/opt/adguardhome/conf
      adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
  changed_when: true

# Readiness (review 9.4.1) : State.Status distingue « démarre » de « crashé » —
# exited/dead termine la boucle immédiatement (fast-fail).
- name: Attendre qu'AdGuard soit prêt (readiness docker inspect)
  ansible.builtin.command:
    cmd: >-
      docker inspect -f {% raw %}{{.State.Status}}{% endraw %} adguard-{{ capsule_id }}
  register: adguard_state
  until: (adguard_state.stdout | trim) in ["running", "exited", "dead"]
  retries: 12
  delay: 5
  changed_when: false

- name: Vérifier qu'AdGuard est running (fast-fail si crash)
  ansible.builtin.fail:
    msg: "Container adguard-{{ capsule_id }} en état '{{ adguard_state.stdout | trim }}' (attendu : running)"
  when: (adguard_state.stdout | trim) != "running"

# Review L6 — mode de panne non couvert jusqu'ici : sans Traefik sur CE dockerd,
# l'app n'a plus AUCUN chemin réseau (les ports hôtes ont disparu en 9.4.5c).
# On nomme la cause ici plutôt que d'échouer sur un « No such container » brut
# au dernier tiers du rôle, une fois le container déjà démarré.
- name: "Vérifier que le container Traefik existe sur ce dockerd"
  ansible.builtin.command:
    cmd: >-
      docker container inspect -f {% raw %}{{.Id}}{% endraw %}
      {{ traefik_container_name | default('homebox-traefik') }}
  register: traefik_container_check
  failed_when: false
  changed_when: false

- name: "Échouer avec un message actionnable si Traefik est introuvable"
  ansible.builtin.fail:
    msg: >-
      Container Traefik « {{ traefik_container_name | default('homebox-traefik') }} »
      introuvable sur le dockerd de ce worker. Depuis la Story 9.4.5c les apps ne
      publient plus de port hôte : Traefik DOIT tourner sur le même dockerd et
      rejoindre « capsule_{{ capsule_id }} », sinon l'app installée reste
      injoignable. Corriger l'extravar `traefik_container_name` ou démarrer
      Traefik, puis relancer l'installation.
  when: traefik_container_check.rc != 0

# `docker ps -a --filter network=…` plutôt que `docker network inspect -f` :
# `ansible.builtin.command` ne passe PAS par un shell, il découpe la commande
# avec shlex — un go-template `{{range .Containers}}…` contient un espace et
# serait éclaté en plusieurs arguments. `-a` inclut les containers arrêtés :
# un Traefik stoppé est TOUJOURS attaché au réseau, le re-connecter échouerait.
- name: "Vérifier si Traefik est déjà attaché au réseau de la capsule"
  ansible.builtin.command:
    cmd: >-
      docker ps -a --filter network=capsule_{{ capsule_id }}
      --format {% raw %}{{.Names}}{% endraw %}
  register: capsule_network_members
  changed_when: false

- name: "Attacher Traefik au réseau de la capsule (Story 9.4.5c AC4 — idempotent)"
  ansible.builtin.command:
    cmd: >-
      docker network connect capsule_{{ capsule_id }}
      {{ traefik_container_name | default('homebox-traefik') }}
  when: >-
    (traefik_container_name | default('homebox-traefik'))
    not in capsule_network_members.stdout_lines
  changed_when: true

- name: Écrire la route Traefik pour adguard.{{ racine_slug }}.homegalaxy.io
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ traefik_dynamic_dir | default('/etc/traefik/dynamic') }}/capsule-{{ capsule_id }}-adguard.yml"
    mode: "0644"
